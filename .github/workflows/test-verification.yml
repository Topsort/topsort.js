name: Verification

on:
  pull_request:
    paths:
      - "packages/verification/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "biome.json"
      - ".github/workflows/test-verification.yml"
  push:
    branches:
      - main
    paths:
      - "packages/verification/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "biome.json"
      - ".github/workflows/test-verification.yml"

jobs:
  react-19-compatibility:
    name: React 19 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install React 19 without changing the workspace lockfile
        run: >-
          bun add --cwd packages/verification --no-save
          react@19.2.7 react-dom@19.2.7 react-test-renderer@19.2.7
          @types/react@19 @types/react-dom@19 @types/react-test-renderer@19
      - name: Test the React adapter
        run: bun run --cwd packages/verification test test/react.test.ts
      - name: Typecheck with React 19
        run: bun run --cwd packages/verification typecheck

  verification:
    name: Unit, browser, and package checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run --cwd packages/verification test

      - name: Typecheck
        run: bun run --cwd packages/verification typecheck

      - name: Biome
        run: bunx biome check packages/verification

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Browser tests
        run: bun run --cwd packages/verification test:browser

      - name: Packed artifact checks
        run: bun run --cwd packages/verification test:package
